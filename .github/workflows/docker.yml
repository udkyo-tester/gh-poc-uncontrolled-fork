name: Build and Push Docker Image

# Mirrors the real docker.yml; the Jenkins and Docker Hub calls are stand-ins.

on:
  workflow_run:
    workflows: ["PyPI Upload"]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        type: string
        required: true
        description: version tag name

permissions:
  contents: read
  actions: read

jobs:
  publish-docker-image:
    name: Publish Docker Image (public) via Jenkins
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Download version artifact
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-version
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Read version from artifact
        if: github.event_name == 'workflow_run'
        id: artifact-version
        run: echo "version=$(cat version.txt)" >> "$GITHUB_OUTPUT"

      - name: Check if stable release
        id: check-stable
        env:
          VERSION: ${{ github.event.inputs.version || steps.artifact-version.outputs.version || github.event.workflow_run.head_branch }}
        run: |
          echo "Checking version: $VERSION"
          if [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_stable=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_stable=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Stand-in for "Trigger Jenkins Job (public registry)" (docker-publish)
        env:
          JENKINS_API_TOKEN: ${{ secrets.POC_SECRET }}
          VERSION: ${{ github.event.inputs.version || steps.artifact-version.outputs.version || github.event.workflow_run.head_branch }}
          REGISTRY: "public"
          TAG_LATEST: ${{ steps.check-stable.outputs.is_stable }}
        run: |
          echo "Running on:       $GITHUB_REPOSITORY @ $GITHUB_REF"
          echo "Would publish:    VERSION=$VERSION REGISTRY=$REGISTRY TAG_LATEST=$TAG_LATEST"
          echo "Secret available: ${JENKINS_API_TOKEN:+yes} (length ${#JENKINS_API_TOKEN})"

      - name: Checkout repository for Docker Hub description
        if: steps.check-stable.outputs.is_stable == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.inputs.version || steps.artifact-version.outputs.version }}
          sparse-checkout: DOCKER.md
          sparse-checkout-cone-mode: false

      - name: Stand-in for "Update Docker Hub description"
        if: steps.check-stable.outputs.is_stable == 'true'
        run: echo "Would push DOCKER.md to Docker Hub"

      - name: Save version for downstream workflows
        env:
          VERSION: ${{ github.event.inputs.version || steps.artifact-version.outputs.version }}
        run: |
          if [ -z "$VERSION" ]; then
            echo "ERROR: VERSION is empty, cannot save version artifact"
            exit 1
          fi
          echo "$VERSION" > version.txt

      - name: Upload version artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-version
          path: version.txt
