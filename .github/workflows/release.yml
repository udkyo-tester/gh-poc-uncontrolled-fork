name: Release and Build Python Wheels

# Mirrors the real release.yml; release creation and the Jenkins call are stand-ins.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      version:
        type: string
        required: true
        description: version tag name to release (e.g. v1.2.3)

jobs:
  create-release:
    name: Create release and build wheel
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Stand-in for "Trigger Jenkins Job" (wheel-build)
        env:
          VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: echo "Would build wheel for VERSION=$VERSION"

      - name: Save version for downstream workflows
        env:
          VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: echo "$VERSION" > version.txt

      - name: Upload version artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-version
          path: version.txt
